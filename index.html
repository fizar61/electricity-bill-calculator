contact:['অভিযোগ ও পরামর্শ','Complaints & Feedback'],rateS:['রেট সেটিংস','Rate Settings'],share:['অ্যাপ শেয়ার করুন','Share App'],
provL:['বিদ্যুৎ প্রদানকারী প্রতিষ্ঠান','Select Provider'],provDef:['ময়মনসিংহ পল্লী বিদ্যুৎ সমিতি-২','Mymensingh Palli Bidyut Samity-2'],provH:['সব হার নিজে বদলাতে পারবেন।','You can edit every rate manually.'],
fixed:['ফিক্সড চার্জ ও ভ্যাট','Fixed charges & VAT'],rentPre:['প্রিপেইড মিটার ভাড়া (৳)','Prepaid meter rent (৳)'],rentPost:['পোস্টপেইড মিটার ভাড়া (৳)','Postpaid meter rent (৳)'],
load:['চুক্তিবদ্ধ লোড (কিলোওয়াট)','Contracted load (kW)'],vatP:['ভ্যাট %','VAT %'],demP:['ডিমান্ড (টাকা/কিলোওয়াট)','Demand (Tk/kW)'],demT:['মোট ডিমান্ড চার্জ','Total demand charge'],
slabs:['ইউনিট স্ল্যাব রেট (টাকা/ইউনিট)','Unit slab rates (Tk/unit)'],slab:['স্ল্যাব','Slab'],upd:['সেটিংস আপডেট করুন','Update Settings'],updd:['সেটিংস আপডেট হয়েছে','Settings updated'],
shT:['অ্যাপ শেয়ার করুন','Share App'],shS:['যে মাধ্যমে পাঠাতে চান বেছে নিন','Choose how you want to share'],shMsg:['বিদ্যুৎ বিল হিসাব করুন মিনিটেই:','Calculate your electricity bill in minutes:'],
copied:['লিংক কপি হয়েছে','Link copied'],copyF:['কপি করা যায়নি','Couldn’t copy'],copy:['কপি','Copy'],more:['আরও','More'],email:['ইমেইল','Email'],sms:['এসএমএস','SMS']
};
const t=k=>T[k][lang==='bn'?0:1];

const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const CAPS=[50,75,200,300,400,600,Infinity],LB=['0-50','51-75','76-200','201-300','301-400','401-600','601+'];
const DEF={provider:'',rentPre:40,rentPost:10,load:1,demand:42,vat:5,rates:[4.65,5.30,8.50,9.10,9.60,15.1,17.40]};
let S=Object.assign({},DEF,ld('bb_s',{}));if(!Array.isArray(S.rates)||S.rates.length!==7)S.rates=DEF.rates.slice();
let H=ld('bb_h',[]),th=ld('bb_t','auto'),last=null,tt,dr,shown=0,raf;
const st={mode:'meter',type:'pre',month:new Date().getMonth(),manual:false,scr:'home',hm:0,free:false,ret:'menu'};
const provName=()=>S.provider&&S.provider!==T.provDef[0]?S.provider:t('provDef');

/* hisab */
const old=u=>u<50?[5,.2]:u<=75?[5.5,.2]:u<=200?[8.5,.15]:u<225?[9,.15]:u<=250?[9.5,.15]:u<=300?[10,.15]:u<=400?[12,.15]:[15.5,.15];
function calc(u){
  const L=[];let tot=0;
  if(st.mode==='sub'){
    const [r,p]=old(u),b=u*r;
    L.push([fmt(u)+' '+t('units')+' × ৳'+fmt(r),b],[t('extra')+' '+fmt(p*100)+'%',b*p]);tot=b*(1+p);
  }else{
    let pv=0;
    CAPS.forEach((c,i)=>{const q=Math.max(0,Math.min(u,c)-pv);pv=c;if(q>0)L.push([t('slab')+' '+dg(i+1)+': '+fmt(q)+' × ৳'+fmt(S.rates[i]),q*S.rates[i]])});
    const e=L.reduce((s,x)=>s+x[1],0),rent=st.type==='pre'?S.rentPre:S.rentPost,dem=S.load*S.demand;
    L.push([t('rent'),rent],[t('dem')+' ('+fmt(S.load)+' '+t('kw')+')',dem]);
    const s=e+rent+dem,v=s*S.vat/100;
    L.push([t('vat')+' '+fmt(S.vat)+'%',v]);tot=s+v;
  }
  return{L,t:tot};
}
const lines=L=>L.map(([l,a])=>`<div><span>${l}</span><b>৳ ${fmt(a)}</b></div>`).join('');

/* animation helpers */
function slide(c){
  let ti=c.querySelector('.th');
  if(!ti){ti=document.createElement('i');ti.className='th';ti.style.transition='none';c.prepend(ti)}
  const b=c.querySelector('.on');if(!b||!b.offsetWidth)return;
  ti.style.width=b.offsetWidth+'px';ti.style.transform=`translateX(${b.offsetLeft}px)`;
  if(ti.style.transition==='none'){ti.offsetWidth;ti.style.transition=''}
}
const slides=()=>document.querySelectorAll('.seg,#navc').forEach(slide);
function stag(el){[...el.children].forEach((c,i)=>{c.style.animation='none';c.offsetWidth;c.style.animation='';c.style.animationDelay=(i*55)+'ms'})}
function tween(to){
  cancelAnimationFrame(raf);
  if(RM){shown=to;$('bill').textContent='৳ '+fmt(to);return}
  const from=shown,t0=performance.now();
  const step=n=>{const k=Math.min(1,(n-t0)/450),e=1-Math.pow(1-k,3);shown=k<1?from+(to-from)*e:to;$('bill').textContent='৳ '+fmt(shown);if(k<1)raf=requestAnimationFrame(step)};
  raf=requestAnimationFrame(step);
}
function toast(m){const e=$('toast');e.hidden=true;e.textContent=m;e.offsetWidth;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,1900)}

/* home */
const seg=(id,k,v)=>document.querySelectorAll('#'+id+' button').forEach(b=>b.classList.toggle('on',b.dataset[k]===v));
function update(){
  const meter=st.mode==='meter';
  $('sType').hidden=!meter;$('flat').hidden=meter;$('io').hidden=st.manual;
  seg('sMode','m',st.mode);seg('sType','ty',st.type);slides();
  $('msg').textContent='';
  let u=NaN;
  if(st.manual)u=num($('tot').value);
  else if(st.free)u=NaN;
  else{
    const p=num($('prev').value),c=num($('cur').value);
    if(!isNaN(p)&&!isNaN(c)){u=c-p;$('tot').value=u<0?'':tf(u);if(u<0)$('msg').textContent=t('err')}
    else $('tot').value='';
  }
  const ok=!isNaN(u)&&u>=0;
  last=ok?Object.assign(calc(u),{u}):null;
  tween(ok?last.t:0);
  $('sv').disabled=!last;
  $('det').innerHTML=last?lines(last.L)+`<div class="tt"><span>${t('total')}</span><b>৳ ${fmt(last.t)}</b></div>`:`<span class="hint">${t('empty')}</span>`;
}
['prev','cur'].forEach(i=>$(i).addEventListener('input',()=>{st.free=false;update()}));
$('tot').addEventListener('input',()=>{const v=$('tot').value.trim();st.manual=v!=='';st.free=v==='';update()});
$('rf').onclick=()=>{['prev','cur','tot'].forEach(i=>$(i).value='');st.manual=false;st.free=false;$('rf').classList.add('spin');update()};
$('rf').addEventListener('animationend',()=>$('rf').classList.remove('spin'));
$('dt').onclick=()=>$('dtBg').classList.add('open');
$('hgo').onclick=()=>go('hist');
$('hgo').addEventListener('animationend',()=>$('hgo').classList.remove('bump'));
$('sMode').onclick=e=>{const b=e.target.closest('button');if(b){st.mode=b.dataset.m;update()}};
$('sType').onclick=e=>{const b=e.target.closest('button');if(b){st.type=b.dataset.ty;update()}};
$('month').innerHTML=MONTHS.map((m,i)=>`<option value="${i}">${m}</option>`).join('');
$('month').value=st.month;
$('month').onchange=e=>{st.month=+e.target.value};
$('sv').onclick=()=>{
  if(!last)return;
  H.unshift({id:Date.now(),m:st.month,mode:st.mode,type:st.type,f:st.mode==='sub'?$('flat').value.trim():'',u:last.u,t:last.t,L:last.L,p:st.manual?null:num($('prev').value),c:st.manual?null:num($('cur').value)});
  sv('bb_h',H);toast(t('saved'));$('hgo').classList.add('bump');
};

/* screens */
const BOLT='<svg viewBox="0 0 48 48"><path d="M27 3 10 27h11l-3 18 20-26H26z"/></svg>';
const IC={
theme:'<path d="M12 3a9 9 0 1 0 0 18c1.4 0 1.8-1 1.3-2-.5-1 0-2 1.3-2H17a4 4 0 0 0 4-4c0-5-4-10-9-10z"/><circle cx="8" cy="11" r="1"/><circle cx="12" cy="7.5" r="1"/><circle cx="16" cy="11" r="1"/>',
lang:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3.5 3.5 3.5 14.5 0 18M12 3c-3.5 3.5-3.5 14.5 0 18"/>',
hist:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
rate:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9M15 5v4M9 15v4"/>',
share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/>',
bolt:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>'
};
const ico=(p,c='')=>`<span class="ic ${c}"><svg viewBox="0 0 24 24">${IC[p]}</svg></span>`;
const CH='<svg class="cv" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>';
const BACK=()=>`<button class="back" data-back aria-label="${t('back')}">‹</button>`;
const hi=c=>`<div class="hi">${c}</div>`;
const tag=(h,fl)=>(h.mode==='sub'?t('sub')+(fl&&h.f?' · '+esc(h.f):''):t('meter')+' · '+t(h.type));
const card=h=>`<div class="card"><div class="h"><span>${dg(new Date(h.id).toLocaleDateString('en-GB'))} · ${tag(h)}</span><button data-del="${h.id}" aria-label="${t('del')}">✕</button></div>${h.mode==='sub'&&h.f?`<div class="fl">${t('flatL')}: ${esc(h.f)}</div>`:''}<div class="m">${h.p!=null?tf(h.p)+' → '+tf(h.c)+' KWh · ':''}${tf(h.u)} ${t('units')}</div><div class="d">${lines(h.L)}</div><div class="tt"><span>${t('total')}</span><b>৳ ${fmt(h.t)}</b></div></div>`;
const cf=(l,k,v)=>`<label class="f"><span>${l}</span><div class="cap b"><input data-k="${k}" type="text" inputmode="decimal" autocomplete="off" value="${dg(v)}"></div></label>`;
const sg=(a,cur,attr)=>`<div class="seg">${a.map(([k,l])=>`<button ${attr}="${k}" class="${cur===k?'on':''}">${l}</button>`).join('')}</div>`;

function go(n,x){
  if(n==='hist'&&(st.scr==='home'||st.scr==='menu'))st.ret=st.scr;
  st.scr=n;if(x!==undefined)st.hm=x;
  $('home').hidden=n!=='home';$('dyn').hidden=n==='home';
  $('actHome').hidden=n!=='home';$('actHist').hidden=true;
  $('nHome').classList.toggle('on',n==='home');$('nMenu').classList.toggle('on',n!=='home');
  $('hd').className=n==='set'?'gh':'';
  let h='',b='';
  if(n==='home'){h=hi(`<div class="logo">${BOLT}</div><h1>${t('app')}</h1><p>${t('slogan')}</p>`)}
  else if(n==='menu'){
    h=hi(BACK()+`<h1>${t('settings')}</h1>`);
    b=`<div class="ms">${t('general')}</div>
<div class="mi">${ico('theme')}<span class="l">${t('theme')}</span>${sg([['auto',t('auto')],['light',t('light')],['dark',t('dark')]],th,'data-th')}</div>
<div class="mi">${ico('lang')}<span class="l">${t('lang')}</span>${sg([['bn','বাংলা'],['en','English']],lang,'data-lg')}</div>
<button class="mi" data-go="hist">${ico('hist')}<span class="l">${t('hist')}</span>${CH}</button>
<button class="mi" data-go="set">${ico('rate')}<span class="l">${t('rateS')}</span>${CH}</button>
<div class="ms">${t('support')}</div>
<a class="mi" href="https://t.me/+8801601500848" target="_blank" rel="noopener">${ico('mail')}<span class="l">${t('contact')}</span>${CH}</a>

<button class="mi" id="share">${ico('share')}<span class="l">${t('share')}</span>${CH}</button>`;
  }else if(n==='hist'){
    h=hi(BACK()+`<h1>${t('hist')}</h1>`);
    b=MONTHS.map((m,i)=>{const c=H.filter(x=>x.m===i).length;return `<button class="mi" data-mo="${i}"><span class="l">${m}</span><i class="cn">${c?dg(c)+t('bills'):''}</i>${CH}</button>`}).join('');
  }else if(n==='hm'){
    h=hi(BACK()+`<h1>${MONTHS[st.hm]}</h1>`);
    const es=H.filter(x=>x.m===st.hm);
    if(es.length){$('actHistIn').innerHTML=`<button class="sum" id="sumBtn"><span class="sg">Σ</span><span>${t('sumL')}</span><b>৳ ${fmt(es.reduce((s,x)=>s+x.t,0))}</b></button>`;$('actHist').hidden=false}
    b=es.length?es.map(card).join(''):`<p class="hint">${t('noBill')}</p>`;
  }else if(n==='set'){
    dr=JSON.parse(JSON.stringify(S));dr.provider=provName();
    h=hi(BACK()+`<h1>${t('rateS')}</h1>`);
    b=`<div class="pc"><div class="gl">${t('provL')}</div><div class="cap b">${ico('bolt','sm')}<input data-k="provider" value="${esc(dr.provider)}" aria-label="${t('provL')}" style="font-size:17px;font-weight:600"></div><p class="hint">${t('provH')}</p></div>
<div class="ms">${t('fixed')}</div>
<div class="gc">${cf(t('rentPre'),'rentPre',dr.rentPre)}${cf(t('rentPost'),'rentPost',dr.rentPost)}${cf(t('load'),'load',dr.load)}<div class="row2">${cf(t('vatP'),'vat',dr.vat)}${cf(t('demP'),'demand',dr.demand)}</div><p class="hint" id="dem">${t('demT')} ৳ ${fmt(dr.load*dr.demand)}</p></div>
<div class="ms">${t('slabs')}</div>
<div class="gc"><div class="row2">${dr.rates.map((r,i)=>cf(t('slab')+' '+dg(i+1)+' ('+dg(LB[i])+')','slab'+i,r)).join('')}</div></div>
<button class="ub" id="upd">${t('upd')}</button>`;
  }
  $('hd').innerHTML=h;$('dyn').innerHTML=b;
  window.scrollTo(0,0);
  stag($('hd'));stag(n==='home'?$('home'):$('dyn'));
  if(n==='home')update();
  slides();
}
$('nHome').onclick=()=>go('home');
$('nMenu').onclick=()=>go('menu');
$('hd').addEventListener('click',e=>{if(e.target.closest('[data-back]'))go(st.scr==='hm'?'hist':st.scr==='menu'?'home':st.scr==='hist'?st.ret:'menu')});
$('dyn').addEventListener('click',e=>{
  const b=e.target.closest('[data-go],[data-th],[data-lg],[data-mo],[data-del],#share,#upd');if(!b)return;
  if(b.dataset.go)go(b.dataset.go);
  else if(b.dataset.th){theme(b.dataset.th);go('menu')}
  else if(b.dataset.lg){lang=b.dataset.lg;sv('bb_l',lang);applyLang();go('menu')}
  else if(b.dataset.mo)go('hm',+b.dataset.mo);
  else if(b.dataset.del){H=H.filter(h=>h.id!=b.dataset.del);sv('bb_h',H);go('hm')}
  else if(b.id==='upd'){
    S=dr;if(!S.provider.trim()||S.provider===T.provDef[0]||S.provider===T.provDef[1])S.provider='';
    sv('bb_s',S);toast(t('updd'));go('menu');
  }else openShare();
});
$('dyn').addEventListener('input',e=>{
  const k=e.target.dataset.k;if(!k)return;
  if(k==='provider')dr.provider=e.target.value;
  else{const n=num(e.target.value);if(isNaN(n))return;if(k.startsWith('slab'))dr.rates[+k.slice(4)]=n;else dr[k]=n}
  const d=$('dem');if(d)d.textContent=t('demT')+' ৳ '+fmt(dr.load*dr.demand);
});

function openSum(){
  const es=H.filter(x=>x.m===st.hm);
  $('smT').textContent=MONTHS[st.hm]+' · '+t('sumL');
  $('smBody').innerHTML=es.map(h=>`<div><span>${dg(new Date(h.id).toLocaleDateString('en-GB'))} · ${tag(h,1)}</span><b>৳ ${fmt(h.t)}</b></div>`).join('')+`<div class="tt"><span>${t('sumL')} (${dg(es.length)})</span><b>৳ ${fmt(es.reduce((s,x)=>s+x.t,0))}</b></div>`;
  $('smBg').classList.add('open');
}
$('actHist').addEventListener('click',e=>{if(e.target.closest('#sumBtn'))openSum()});
/* share */
function openShare(){
  const u=APP_URL,m=t('shMsg'),e=encodeURIComponent,full=e(m+' '+u);
  const ch=[['WhatsApp','#25D366','W','https://wa.me/?text='+full],['Telegram','#229ED9','T','https://t.me/share/url?url='+e(u)+'&text='+e(m)],['Facebook','#1877F2','f','https://www.facebook.com/sharer/sharer.php?u='+e(u)],[t('sms'),'#6b7a72','SMS','sms:?body='+full],[t('email'),'#EA4335','@','mailto:?subject='+e(t('app'))+'&body='+full]];
  $('chan').innerHTML=ch.map(([n,c,g,h],i)=>`<a href="${h}" target="_blank" rel="noopener" style="--d:${i*50+120}ms"><b style="background:${c}">${g}</b><span>${n}</span></a>`).join('')+(navigator.share?`<button id="shMore" style="--d:370ms"><b style="background:var(--g)">⋯</b><span>${t('more')}</span></button>`:'');
  if($('shMore'))$('shMore').onclick=()=>navigator.share({title:t('app'),text:m,url:u}).catch(()=>{});
  $('shUrl').value=u;$('shBg').classList.add('open');
}
const closeShare=()=>$('shBg').classList.remove('open');
document.querySelectorAll('.shbg').forEach(b=>b.addEventListener('click',e=>{if(e.target===b)b.classList.remove('open')}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.shbg').forEach(b=>b.classList.remove('open'))});
$('shCopy').onclick=async()=>{
  try{await navigator.clipboard.writeText(APP_URL);toast(t('copied'))}
  catch(e){const i=$('shUrl');i.select();try{document.execCommand('copy');toast(t('copied'))}catch(x){toast(t('copyF'))}}
};

/* theme + language */
function theme(v){th=v;sv('bb_t',v);const r=document.documentElement;v==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',v)}
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll('[data-pi]').forEach(e=>e.placeholder=t(e.dataset.pi));
  document.querySelectorAll('.num').forEach(e=>e.placeholder=dg('0'));
  $('nMenu').setAttribute('aria-label',t('settings'));$('nHome').setAttribute('aria-label',t('home'));$('hgo').setAttribute('aria-label',t('hist'));
}

theme(th);applyLang();go('home');
if(document.fonts)document.fonts.ready.then(slides);
addEventListener('resize',slides);
const sp=$('splash'),hide=()=>sp.classList.add('off');
sp.addEventListener('click',hide);setTimeout(hide,2600);
</script>
